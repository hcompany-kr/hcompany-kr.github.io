---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 | {{ site.title }}</title>
<meta name="description" content="녹음과 기록에 관해 알아두면 좋은 것들.">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<link rel="alternate" hreflang="ko" href="{{ '/blog/ko/' | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ '/blog/en/' | absolute_url }}">
<link rel="alternate" hreflang="ja" href="{{ '/blog/ja/' | absolute_url }}">
<link rel="alternate" hreflang="es" href="{{ '/blog/es/' | absolute_url }}">
<link rel="alternate" hreflang="it" href="{{ '/blog/it/' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/blog/en/' | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:title" content="블로그 | {{ site.title }}">
<meta property="og:description" content="녹음과 기록에 관해 알아두면 좋은 것들.">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<header class="masthead">
  <a class="wordmark" href="{{ '/' | relative_url }}">에이치컴퍼니</a>
  <nav class="langs" aria-label="언어">
    <span class="lang is-current">ko</span>
    <a class="lang" href="{{ '/blog/en/' | relative_url }}">en</a>
    <a class="lang" href="{{ '/blog/ja/' | relative_url }}">ja</a>
    <a class="lang" href="{{ '/blog/es/' | relative_url }}">es</a>
    <a class="lang" href="{{ '/blog/it/' | relative_url }}">it</a>
  </nav>
</header>

<main>
  <div class="index-head">
    <h1>블로그</h1>
  </div>

  <div class="list">
    {% assign posts = site.posts | where: "lang", "ko" | sort: "date" | reverse %}
    {% for post in posts %}
    <div class="list-item">
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <p>{{ post.description }}</p>
    </div>
    {% endfor %}
  </div>
</main>

<footer class="colophon">
  <p>{{ site.title }}</p>
</footer>
</body>
</html>
